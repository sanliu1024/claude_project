<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术博客 - Markdown 编辑器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #e5e9ef;
            --text-primary: #1a1a1a;
            --text-secondary: #57606a;
            --text-muted: #8b949e;
            --border-color: #e1e4e8;
            --accent: #0969da;
            --accent-hover: #0855c2;
            --code-bg: #f6f8fa;
            --code-border: #e1e4e8;
            --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --shadow-hover: 0 4px 6px rgba(0,0,0,0.15);
        }

        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --border-color: #30363d;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --code-bg: #161b22;
            --code-border: #30363d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent), #8a2be2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--text-muted);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .theme-toggle {
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* Container */
        .container {
            display: flex;
            height: calc(100vh - 61px);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .file-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
            transition: all 0.2s;
        }

        .file-item:hover {
            background: var(--bg-tertiary);
        }

        .file-item.active {
            background: var(--accent);
            color: white;
        }

        .file-icon {
            font-size: 14px;
            opacity: 0.7;
        }

        .file-item.active .file-icon {
            opacity: 1;
        }

        .file-name {
            flex: 1;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .file-item.active .file-meta {
            color: rgba(255,255,255,0.7);
        }

        .file-actions {
            display: none;
            gap: 4px;
        }

        .file-item:hover .file-actions,
        .file-item.active .file-actions {
            display: flex;
        }

        .icon-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: rgba(0,0,0,0.1);
            color: white;
            font-size: 12px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(0,0,0,0.2);
        }

        .file-item:not(.active) .icon-btn {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .file-item:not(.active) .icon-btn:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        /* 文件夹树形结构 */
        .folder-tree {
            user-select: none;
        }

        .folder-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .folder-item:hover {
            background: var(--bg-tertiary);
        }

        .folder-item.active {
            background: var(--bg-tertiary);
        }

        .folder-toggle {
            font-size: 10px;
            width: 16px;
            text-align: center;
            color: var(--text-muted);
            transition: transform 0.2s;
        }

        .folder-toggle.open {
            transform: rotate(90deg);
        }

        .folder-icon {
            font-size: 14px;
        }

        .folder-name {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .folder-actions {
            display: none;
            gap: 4px;
        }

        .folder-item:hover .folder-actions {
            display: flex;
        }

        .folder-children {
            display: none;
            padding-left: 16px;
        }

        .folder-children.open {
            display: block;
        }

        .file-item.in-folder {
            padding-left: 32px;
        }

        /* 根目录文件样式 */
        .root-files {
            padding-left: 0;
        }

        /* 新建按钮区域 */
        .new-buttons {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .new-dropdown {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .new-dropdown-btn {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .new-dropdown-btn:hover {
            background: var(--accent-hover);
        }

        .new-dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: var(--shadow-hover);
            z-index: 100;
            margin-top: 4px;
            overflow: hidden;
        }

        .new-dropdown-menu.show {
            display: block;
        }

        .new-dropdown-item {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-primary);
            transition: background 0.2s;
        }

        .new-dropdown-item:hover {
            background: var(--bg-secondary);
        }

        .new-dropdown-item .icon {
            font-size: 16px;
        }

        .new-dropdown-divider {
            height: 1px;
            background: var(--border-color);
        }

        /* 位置选择 */
        .location-selector {
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 6px;
            margin: 8px 12px;
        }

        .location-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .location-tree {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-primary);
        }

        .location-item {
            padding: 6px 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
        }

        .location-item:hover {
            background: var(--bg-tertiary);
        }

        .location-item.selected {
            background: var(--accent);
            color: white;
        }

        .location-item .icon {
            font-size: 12px;
        }
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            min-width: 0;
            transition: width 0.3s, flex 0.3s;
        }

        /* 预览模式 - 隐藏编辑器 */
        .main.preview-mode .editor-container {
            display: none;
        }

        .main.preview-mode .preview-container {
            flex: 1;
        }

        /* 编辑模式按钮 */
        .edit-mode-toggle {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .edit-mode-toggle:hover {
            background: var(--bg-secondary);
            border-color: var(--text-muted);
        }

        .edit-mode-toggle.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .edit-mode-toggle .icon {
            font-size: 16px;
        }

        .editor-header {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .editor-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .status {
            font-size: 12px;
            color: var(--text-muted);
        }

        .status.saved {
            color: #238636;
        }

        textarea {
            flex: 1;
            padding: 20px;
            border: none;
            resize: none;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.7;
            outline: none;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .preview-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px 40px;
            background: var(--bg-primary);
        }

        .preview-content {
            max-width: 720px;
            margin: 0 auto;
        }

        /* Markdown Styles */
        .preview h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 24px 0 16px;
            color: var(--text-primary);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .preview h2 {
            font-size: 22px;
            font-weight: 600;
            margin: 20px 0 12px;
            color: var(--text-primary);
        }

        .preview h3 {
            font-size: 18px;
            font-weight: 600;
            margin: 16px 0 10px;
            color: var(--text-primary);
        }

        .preview p {
            margin: 12px 0;
            line-height: 1.7;
            color: var(--text-primary);
        }

        .preview code {
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .preview pre {
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 16px 0;
        }

        .preview pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: 13px;
            line-height: 1.6;
        }

        .preview ul, .preview ol {
            margin: 12px 0;
            padding-left: 24px;
            line-height: 1.7;
        }

        .preview li {
            margin: 4px 0;
        }

        .preview blockquote {
            border-left: 3px solid var(--accent);
            margin: 16px 0;
            padding: 12px 16px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border-radius: 0 6px 6px 0;
        }

        .preview a {
            color: var(--accent);
            text-decoration: none;
        }

        .preview a:hover {
            text-decoration: underline;
        }

        .preview table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }

        .preview th, .preview td {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        .preview th {
            background: var(--bg-secondary);
            font-weight: 600;
        }

        .preview img {
            max-width: 100%;
            border-radius: 8px;
            margin: 16px 0;
        }

        .preview hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 24px 0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-primary);
            padding: 24px;
            border-radius: 12px;
            min-width: 320px;
            box-shadow: var(--shadow-hover);
        }

        .modal-content h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .modal-content input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }

        .modal-content input:focus {
            border-color: var(--accent);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        #fileInput {
            display: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                z-index: 100;
                height: 100%;
                transform: translateX(-100%);
            }

            .sidebar.show {
                transform: translateX(0);
                box-shadow: var(--shadow-hover);
            }

            .preview-container {
                padding: 20px;
            }

            .header {
                padding: 12px 16px;
            }

            /* 移动端编辑模式 */
            .main:not(.preview-mode) {
                flex-direction: column;
            }

            .main:not(.preview-mode) .editor-container {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                flex: 0 0 50%;
            }

            .main:not(.preview-mode) .preview-container {
                flex: 0 0 50%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">&lt;/&gt;</div>
                <span>技术博客</span>
            </div>
            <div class="toolbar">
                <div class="new-dropdown">
                    <button class="btn btn-primary" onclick="toggleNewMenu()">+ 新建</button>
                    <div class="new-dropdown-menu" id="newMenu">
                        <div class="location-selector" onclick="event.stopPropagation()">
                            <div class="location-label">保存位置</div>
                            <div class="location-tree" id="locationTree"></div>
                        </div>
                        <div class="new-dropdown-divider"></div>
                        <div class="new-dropdown-item" onclick="newFile()">
                            <span class="icon">📄</span>
                            新建 Markdown 文件
                        </div>
                        <div class="new-dropdown-item" onclick="newFolder()">
                            <span class="icon">📁</span>
                            新建文件夹
                        </div>
                    </div>
                </div>
                <button class="btn" onclick="openFile()">导入</button>
                <button class="btn" onclick="handleSaveClick(event)">保存</button>
                <button class="edit-mode-toggle" id="editModeToggle" onclick="toggleEditMode()" title="切换编辑模式">
                    <span class="icon">✏️</span>
                    <span id="editModeText">编辑</span>
                </button>
            </div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
            <span id="themeIcon">🌙</span>
        </button>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">文件浏览器</div>
                <input type="text" class="search-box" placeholder="搜索..." id="searchBox" oninput="filterFiles()">
            </div>
            <div class="file-list folder-tree" id="fileList"></div>
        </div>
        <div class="main">
            <div class="editor-container">
                <div class="editor-header">
                    <span class="editor-title" id="filename">未命名.md</span>
                    <span class="status" id="status">已保存</span>
                </div>
                <textarea id="input" placeholder="开始写作..."></textarea>
            </div>
            <div class="preview-container">
                <div class="preview-content preview" id="output"></div>
            </div>
        </div>
    </div>
    <input type="file" id="fileInput" accept=".md,.txt" onchange="handleFileSelect(event)">
    <div class="modal" id="renameModal">
        <div class="modal-content">
            <h3>重命名文件</h3>
            <input type="text" id="renameInput" placeholder="新文件名">
            <div class="modal-buttons">
                <button class="btn" onclick="hideRenameModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmRename()">确定</button>
            </div>
        </div>
    </div>
    <script>
        const API_BASE = '/api/files';
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const fileInput = document.getElementById('fileInput');
        const filenameEl = document.getElementById('filename');
        const fileListEl = document.getElementById('fileList');
        const renameModal = document.getElementById('renameModal');
        const renameInput = document.getElementById('renameInput');
        const searchBox = document.getElementById('searchBox');
        const statusEl = document.getElementById('status');

        let currentFilename = '未命名.md';
        let fileHandle = null;
        let files = {};
        let currentFileId = null;
        let saveTimeout = null;
        let currentTheme = 'light';
        let editMode = false; // 编辑模式状态
        let selectedParentId = null; // 选中的父文件夹ID

        // API 调用函数
        async function apiCall(url, options = {}) {
            const response = await fetch(url, {
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers
                },
                ...options
            });
            if (!response.ok && response.status !== 204) {
                throw new Error(`API Error: ${response.status}`);
            }
            if (response.status === 204) return null;
            return response.json();
        }

        // 从云端加载文件
        async function loadFilesFromCloud() {
            try {
                const cloudFiles = await apiCall(API_BASE);
                if (cloudFiles && cloudFiles.length > 0) {
                    files = {};
                    cloudFiles.forEach(file => {
                        files[file.id] = {
                            id: file.id,
                            name: file.name,
                            content: file.content,
                            isFolder: file.is_folder || false,
                            parentId: file.parent_id || null,
                            path: file.path || '/',
                            updatedAt: file.updated_at || new Date().toISOString()
                        };
                    });
                } else {
                    await createDefaultFiles();
                }
            } catch (error) {
                console.error('加载文件失败，使用本地存储:', error);
                const saved = localStorage.getItem('mdFiles');
                if (saved) {
                    files = JSON.parse(saved);
                }
            }
        }

        // 创建默认文件
        async function createDefaultFiles() {
            const defaultFiles = [
                {
                    id: 'welcome',
                    name: '欢迎使用.md',
                    content: '# 欢迎使用技术博客编辑器\n\n这是一个支持 Markdown 的实时预览编辑器。\n\n## 功能特性\n\n- **实时预览**：左侧编辑，右侧实时渲染\n- **云端存储**：所有文件保存在云端数据库\n- **深色主题**：支持深色/浅色主题切换\n- **代码高亮**：支持代码语法高亮\n\n## 代码示例\n\n```javascript\nfunction hello() {\n    console.log("Hello, World!");\n}\n```\n\n## 快捷键\n\n| 快捷键 | 功能 |\n|--------|------|\n| Ctrl+S | 保存 |\n| Ctrl+N | 新建 |\n| Ctrl+O | 打开 |\n\n开始你的写作之旅吧！',
                    isFolder: false,
                    parentId: null,
                    path: '/'
                },
                {
                    id: 'tutorial',
                    name: 'Markdown 教程.md',
                    content: '# Markdown 基础教程\n\n## 标题\n\n使用 `#` 来创建标题，支持 1-6 级。\n\n## 文本样式\n\n- **粗体**：使用 `**文本**`\n- *斜体*：使用 `*文本*`\n- ~~删除线~~：使用 `~~文本~~`\n\n## 列表\n\n- 无序列表项 1\n- 无序列表项 2\n\n1. 有序列表项 1\n2. 有序列表项 2\n\n## 代码\n\n行内代码：`code`\n\n代码块：\n\n```python\ndef hello():\n    print("Hello, World!")\n```\n\n## 链接和图片\n\n[链接文本](https://example.com)\n\n## 引用\n\n> 这是一段引用文本。',
                    isFolder: false,
                    parentId: null,
                    path: '/'
                }
            ];

            for (const file of defaultFiles) {
                try {
                    await apiCall(API_BASE, {
                        method: 'POST',
                        body: JSON.stringify(file)
                    });
                    files[file.id] = { ...file, updatedAt: new Date().toISOString() };
                } catch (error) {
                    console.error('创建默认文件失败:', error);
                }
            }
        }

        // 保存当前文件到云端
        async function saveCurrentFile() {
            if (!currentFileId || !files[currentFileId]) return;

            files[currentFileId].content = input.value;
            files[currentFileId].updatedAt = new Date().toISOString();

            localStorage.setItem('mdFiles', JSON.stringify(files));

            try {
                await apiCall(`${API_BASE}/${currentFileId}`, {
                    method: 'PUT',
                    body: JSON.stringify(files[currentFileId])
                });
                statusEl.textContent = '已保存';
                statusEl.classList.add('saved');
            } catch (error) {
                console.error('保存到云端失败:', error);
                statusEl.textContent = '保存失败';
                statusEl.classList.remove('saved');
            }
        }

        // 自动保存
        function autoSave() {
            clearTimeout(saveTimeout);
            statusEl.textContent = '保存中...';
            statusEl.classList.remove('saved');
            saveTimeout = setTimeout(() => {
                saveCurrentFile();
            }, 1000);
        }

        // 渲染文件列表（支持文件夹树形结构）
        function renderFileList() {
            const filterText = searchBox.value.toLowerCase();
            fileListEl.innerHTML = '';

            // 按路径组织文件
            const fileArray = Object.values(files);
            const folderState = JSON.parse(localStorage.getItem('folderState') || '{}');

            if (filterText) {
                // 搜索模式：显示所有匹配的文件，显示路径
                const matchedFiles = fileArray.filter(f =>
                    !f.isFolder && f.name.toLowerCase().includes(filterText)
                );

                if (matchedFiles.length === 0) {
                    fileListEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">未找到匹配的文件</div>';
                    return;
                }

                matchedFiles
                    .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
                    .forEach(file => {
                        const item = document.createElement('div');
                        const isInFolder = file.parentId && file.parentId !== null;
                        item.className = `file-item ${file.id === currentFileId ? 'active' : ''}`;
                        const date = new Date(file.updatedAt).toLocaleDateString('zh-CN');
                        const pathStr = getFilePath(file);
                        item.innerHTML = `
                            <span class="file-icon">📄</span>
                            <div>
                                <div class="file-name">${file.name}</div>
                                <div class="file-meta">${pathStr}</div>
                            </div>
                            <div class="file-actions">
                                <button class="icon-btn" onclick="event.stopPropagation(); renameFile('${file.id}')" title="重命名">✎</button>
                                <button class="icon-btn" onclick="event.stopPropagation(); deleteFile('${file.id}')" title="删除">✕</button>
                            </div>
                        `;
                        item.onclick = () => switchFile(file.id);
                        fileListEl.appendChild(item);
                    });
            } else {
                // 正常模式：显示树形结构
                const rootItems = fileArray.filter(f => !f.parentId || f.parentId === null);
                renderItems(rootItems, fileListEl, folderState, filterText);
            }
        }

        // 获取文件完整路径
        function getFilePath(file) {
            if (!file.parentId || file.parentId === null) {
                return '/';
            }
            const parent = files[file.parentId];
            if (!parent) {
                return '/';
            }
            const parentPath = getFilePath(parent);
            return parentPath === '/' ? `/${parent.name}` : `${parentPath}/${parent.name}`;
        }

        function renderItems(items, container, folderState, filterText) {
            items
                .filter(item => {
                    if (item.isFolder) {
                        // 文件夹：检查自身是否匹配，或者是否有子项匹配
                        const children = Object.values(files).filter(f => f.parentId === item.id);
                        return item.name.toLowerCase().includes(filterText) ||
                               children.some(child => hasMatchingDescendant(child, filterText));
                    }
                    return item.name.toLowerCase().includes(filterText);
                })
                .sort((a, b) => {
                    // 文件夹在前，文件在后
                    if (a.isFolder && !b.isFolder) return -1;
                    if (!a.isFolder && b.isFolder) return 1;
                    // 同类型按更新时间排序
                    return new Date(b.updatedAt) - new Date(a.updatedAt);
                })
                .forEach(item => {
                    if (item.isFolder) {
                        renderFolder(item, container, folderState, filterText);
                    } else {
                        renderFile(item, container, filterText);
                    }
                });
        }

        // 检查是否有匹配的后代
        function hasMatchingDescendant(item, filterText) {
            if (item.name.toLowerCase().includes(filterText)) {
                return true;
            }
            const children = Object.values(files).filter(f => f.parentId === item.id);
            return children.some(child => hasMatchingDescendant(child, filterText));
        }

        function renderFolder(folder, container, folderState, filterText) {
            const isOpen = folderState[folder.id] !== false; // 默认打开
            const item = document.createElement('div');
            item.className = 'folder-item';

            // 获取子项目
            const children = Object.values(files).filter(f => f.parentId === folder.id);
            const hasChildren = children.length > 0;

            item.innerHTML = `
                <span class="folder-toggle ${isOpen && hasChildren ? 'open' : ''}" onclick="event.stopPropagation(); toggleFolder('${folder.id}')">${hasChildren ? '▶' : ''}</span>
                <span class="folder-icon">📁</span>
                <span class="folder-name">${folder.name}</span>
                <div class="folder-actions">
                    <button class="icon-btn" onclick="event.stopPropagation(); renameFile('${folder.id}')" title="重命名">✎</button>
                    <button class="icon-btn" onclick="event.stopPropagation(); deleteFile('${folder.id}')" title="删除">✕</button>
                </div>
            `;

            item.onclick = () => toggleFolder(folder.id);
            container.appendChild(item);

            // 渲染子项目
            if (hasChildren) {
                const childContainer = document.createElement('div');
                childContainer.className = `folder-children ${isOpen ? 'open' : ''}`;
                childContainer.id = `folder-${folder.id}`;
                container.appendChild(childContainer);

                // 过滤子项目
                const filteredChildren = children.filter(child => {
                    if (child.isFolder) {
                        return hasMatchingDescendant(child, filterText);
                    }
                    return child.name.toLowerCase().includes(filterText);
                });

                renderItems(filteredChildren, childContainer, folderState, filterText);
            }
        }

        function renderFile(file, container, filterText) {
            const item = document.createElement('div');
            const isInFolder = file.parentId && file.parentId !== null;
            item.className = `file-item ${file.id === currentFileId ? 'active' : ''} ${isInFolder ? 'in-folder' : ''}`;
            const date = new Date(file.updatedAt).toLocaleDateString('zh-CN');
            item.innerHTML = `
                <span class="file-icon">📄</span>
                <div>
                    <div class="file-name">${file.name}</div>
                    <div class="file-meta">${date}</div>
                </div>
                <div class="file-actions">
                    <button class="icon-btn" onclick="event.stopPropagation(); renameFile('${file.id}')" title="重命名">✎</button>
                    <button class="icon-btn" onclick="event.stopPropagation(); deleteFile('${file.id}')" title="删除">✕</button>
                </div>
            `;
            item.onclick = () => switchFile(file.id);
            container.appendChild(item);
        }

        function toggleFolder(folderId) {
            const folderState = JSON.parse(localStorage.getItem('folderState') || '{}');
            folderState[folderId] = folderState[folderId] === false ? true : false;
            localStorage.setItem('folderState', JSON.stringify(folderState));
            renderFileList();
        }

        // 新建下拉菜单
        function toggleNewMenu() {
            const menu = document.getElementById('newMenu');
            menu.classList.toggle('show');
            if (menu.classList.contains('show')) {
                updateLocationTree();
            }
        }

        // 点击外部关闭菜单
        document.addEventListener('click', function(e) {
            const dropdown = document.querySelector('.new-dropdown');
            if (!dropdown.contains(e.target)) {
                document.getElementById('newMenu').classList.remove('show');
            }
        });

        // 更新位置选择树
        function updateLocationTree() {
            const tree = document.getElementById('locationTree');
            tree.innerHTML = '';

            // 根目录选项
            const rootItem = document.createElement('div');
            rootItem.className = `location-item ${selectedParentId === null ? 'selected' : ''}`;
            rootItem.innerHTML = '<span class="icon">🏠</span> 根目录 (/)';
            rootItem.onclick = (e) => { e.stopPropagation(); selectLocation(null); };
            tree.appendChild(rootItem);

            // 获取所有文件夹
            const folders = Object.values(files).filter(f => f.isFolder);

            // 递归渲染文件夹
            function renderFolderOption(folder, depth = 0) {
                const item = document.createElement('div');
                item.className = `location-item ${selectedParentId === folder.id ? 'selected' : ''}`;
                item.style.paddingLeft = (12 + depth * 16) + 'px';
                item.innerHTML = `<span class="icon">📁</span> ${folder.name}`;
                item.onclick = (e) => { e.stopPropagation(); selectLocation(folder.id); };
                tree.appendChild(item);

                // 渲染子文件夹
                const children = folders.filter(f => f.parentId === folder.id);
                children.forEach(child => renderFolderOption(child, depth + 1));
            }

            // 渲染根目录下的文件夹
            const rootFolders = folders.filter(f => !f.parentId || f.parentId === null);
            rootFolders.forEach(folder => renderFolderOption(folder));
        }

        // 选择位置
        function selectLocation(parentId) {
            selectedParentId = parentId;
            updateLocationTree();
            // 不关闭菜单，让用户继续创建文件
        }

        // 筛选文件
        function filterFiles() {
            renderFileList();
        }

        // 切换文件
        async function switchFile(fileId) {
            if (currentFileId && files[currentFileId]) {
                files[currentFileId].content = input.value;
                await saveCurrentFile();
            }

            const file = files[fileId];
            if (file) {
                currentFileId = fileId;
                currentFilename = file.name;
                input.value = file.content;
                filenameEl.textContent = currentFilename;
                render();
                renderFileList();
            }
        }

        // 新建文件
        async function newFile() {
            // 关闭下拉菜单
            document.getElementById('newMenu').classList.remove('show');

            if (input.value.trim() !== '' && !confirm('确定要新建文件吗？当前未保存的内容将丢失。')) {
                return;
            }
            const newId = 'file_' + Date.now();
            const newFileName = prompt('请输入文件名:', '新文章.md');
            if (!newFileName) return;

            // 使用选中的位置
            const parentId = selectedParentId;

            // 计算路径
            const parentPath = parentId && files[parentId] ? files[parentId].path + files[parentId].name + '/' : '/';
            const newPath = parentPath;

            const newFile = {
                id: newId,
                name: newFileName,
                content: '',
                isFolder: false,
                parentId: parentId,
                path: newPath
            };

            files[newId] = newFile;

            try {
                await apiCall(API_BASE, {
                    method: 'POST',
                    body: JSON.stringify(newFile)
                });
            } catch (error) {
                console.error('创建文件失败:', error);
            }

            switchFile(newId);
        }

        // 新建文件夹
        async function newFolder() {
            // 关闭下拉菜单
            document.getElementById('newMenu').classList.remove('show');

            const folderName = prompt('请输入文件夹名称:', '新文件夹');
            if (!folderName) return;

            // 使用选中的位置
            const parentId = selectedParentId;

            // 计算路径
            const parentPath = parentId && files[parentId] ? files[parentId].path + files[parentId].name + '/' : '/';
            const newPath = parentPath;

            const newId = 'folder_' + Date.now();
            const newFolder = {
                id: newId,
                name: folderName,
                content: '',
                isFolder: true,
                parentId: parentId,
                path: newPath
            };

            files[newId] = newFolder;

            try {
                await apiCall(API_BASE, {
                    method: 'POST',
                    body: JSON.stringify(newFolder)
                });
            } catch (error) {
                console.error('创建文件夹失败:', error);
            }

            renderFileList();
        }

        // 删除文件或文件夹
        async function deleteFile(fileId) {
            const item = files[fileId];
            if (!item) return;

            // 获取子项目数量
            const children = Object.values(files).filter(f => f.parentId === fileId);
            const message = item.isFolder
                ? `确定要删除文件夹 "${item.name}" 吗？${children.length > 0 ? `（包含 ${children.length} 个子项目）` : ''}`
                : `确定要删除文件 "${item.name}" 吗？`;

            if (!confirm(message)) return;

            try {
                // 如果是文件夹，先删除所有子文件
                if (item.isFolder) {
                    const deleteChildren = (parentId) => {
                        const childItems = Object.values(files).filter(f => f.parentId === parentId);
                        childItems.forEach(child => {
                            if (child.isFolder) {
                                deleteChildren(child.id);
                            }
                            delete files[child.id];
                        });
                    };
                    deleteChildren(fileId);
                }

                await apiCall(`${API_BASE}/${fileId}`, {
                    method: 'DELETE'
                });
            } catch (error) {
                console.error('删除失败:', error);
            }

            delete files[fileId];

            // 如果删除的是当前文件，切换到其他文件
            if (currentFileId === fileId) {
                const remainingFiles = Object.values(files).filter(f => !f.isFolder);
                if (remainingFiles.length > 0) {
                    switchFile(remainingFiles[0].id);
                } else {
                    currentFileId = null;
                    currentFilename = '未命名.md';
                    input.value = '';
                    filenameEl.textContent = currentFilename;
                    render();
                }
            }

            renderFileList();
        }

        // 重命名文件
        function renameFile(fileId) {
            const file = files[fileId];
            if (!file) return;

            currentFileId = fileId;
            showRenameModal();
        }

        function showRenameModal() {
            renameInput.value = currentFilename;
            renameModal.classList.add('show');
            renameInput.focus();
            renameInput.select();
        }

        function hideRenameModal() {
            renameModal.classList.remove('show');
        }

        async function confirmRename() {
            const newName = renameInput.value.trim();
            if (!newName) return;

            if (currentFileId && files[currentFileId]) {
                files[currentFileId].name = newName;
                currentFilename = newName;
                filenameEl.textContent = newName;

                try {
                    await apiCall(`${API_BASE}/${currentFileId}`, {
                        method: 'PUT',
                        body: JSON.stringify(files[currentFileId])
                    });
                } catch (error) {
                    console.error('重命名失败:', error);
                }

                renderFileList();
            }
            hideRenameModal();
        }

        // 主题切换
        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('themeIcon').textContent = currentTheme === 'light' ? '🌙' : '☀️';
            localStorage.setItem('theme', currentTheme);
        }

        // 编辑模式切换
        function toggleEditMode() {
            editMode = !editMode;
            const mainEl = document.querySelector('.main');
            const toggleBtn = document.getElementById('editModeToggle');
            const toggleText = document.getElementById('editModeText');

            if (editMode) {
                mainEl.classList.remove('preview-mode');
                toggleBtn.classList.add('active');
                toggleText.textContent = '预览';
                toggleBtn.querySelector('.icon').textContent = '👁️';
                input.focus();
            } else {
                mainEl.classList.add('preview-mode');
                toggleBtn.classList.remove('active');
                toggleText.textContent = '编辑';
                toggleBtn.querySelector('.icon').textContent = '✏️';
            }

            localStorage.setItem('editMode', editMode);
        }

        // 初始化编辑模式
        function initEditMode() {
            const savedMode = localStorage.getItem('editMode');
            if (savedMode === 'true') {
                editMode = true;
                document.querySelector('.main').classList.remove('preview-mode');
                document.getElementById('editModeToggle').classList.add('active');
                document.getElementById('editModeText').textContent = '预览';
                document.getElementById('editModeToggle').querySelector('.icon').textContent = '👁️';
            } else {
                // 默认预览模式
                document.querySelector('.main').classList.add('preview-mode');
                editMode = false;
            }
        }

        // 初始化主题
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            currentTheme = savedTheme;
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('themeIcon').textContent = currentTheme === 'light' ? '🌙' : '☀️';
        }

        // 模态框事件
        renameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                confirmRename();
            } else if (e.key === 'Escape') {
                hideRenameModal();
            }
        });

        renameModal.addEventListener('click', function(e) {
            if (e.target === renameModal) {
                hideRenameModal();
            }
        });

        // 初始化
        async function init() {
            initTheme();
            initEditMode();
            await loadFilesFromCloud();
            const firstFile = Object.values(files)[0];
            if (firstFile) {
                switchFile(firstFile.id);
            }
        }

        init();

        function render() {
            output.innerHTML = marked.parse(input.value);
        }

        async function openFile() {
            if ('showOpenFilePicker' in window) {
                try {
                    [fileHandle] = await window.showOpenFilePicker({
                        types: [{
                            description: 'Markdown 文件',
                            accept: { 'text/markdown': ['.md'], 'text/plain': ['.txt'] }
                        }]
                    });
                    const file = await fileHandle.getFile();
                    const content = await file.text();
                    const newId = 'file_' + Date.now();
                    const newFile = {
                        id: newId,
                        name: file.name,
                        content: content
                    };
                    files[newId] = newFile;

                    try {
                        await apiCall(API_BASE, {
                            method: 'POST',
                            body: JSON.stringify(newFile)
                        });
                    } catch (error) {
                        console.error('上传文件到云端失败:', error);
                    }

                    switchFile(newId);
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('打开文件失败:', err);
                        fileInput.click();
                    }
                }
            } else {
                fileInput.click();
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const content = e.target.result;
                const newId = 'file_' + Date.now();
                const newFile = {
                    id: newId,
                    name: file.name,
                    content: content
                };
                files[newId] = newFile;

                try {
                    await apiCall(API_BASE, {
                        method: 'POST',
                        body: JSON.stringify(newFile)
                    });
                } catch (error) {
                    console.error('上传文件到云端失败:', error);
                }

                switchFile(newId);
            };
            reader.readAsText(file);
            fileInput.value = '';
        }

        async function saveFile() {
            await saveCurrentFile();

            if (fileHandle) {
                try {
                    const writable = await fileHandle.createWritable();
                    await writable.write(input.value);
                    await writable.close();
                    return;
                } catch (err) {
                    console.warn('保存到本地文件失败，尝试另存为:', err);
                }
            }
            if (confirm('已保存到云端。是否要导出到本地文件？')) {
                await saveAs();
            }
        }

        function handleSaveClick(event) {
            if (event.shiftKey) {
                saveAs();
            } else {
                saveFile();
            }
        }

        async function saveAs() {
            if ('showSaveFilePicker' in window) {
                try {
                    fileHandle = await window.showSaveFilePicker({
                        suggestedName: currentFilename,
                        types: [{
                            description: 'Markdown 文件',
                            accept: { 'text/markdown': ['.md'] }
                        }]
                    });
                    const writable = await fileHandle.createWritable();
                    await writable.write(input.value);
                    await writable.close();
                    currentFilename = fileHandle.name;
                    filenameEl.textContent = currentFilename;
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('保存失败:', err);
                        fallbackSave();
                    }
                }
            } else {
                fallbackSave();
            }
        }

        function fallbackSave() {
            const content = input.value;
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 快捷键支持
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 's' && !e.shiftKey) {
                    e.preventDefault();
                    saveFile();
                } else if (e.key === 'S' && e.shiftKey) {
                    e.preventDefault();
                    saveAs();
                } else if (e.key === 'o') {
                    e.preventDefault();
                    openFile();
                } else if (e.key === 'n') {
                    e.preventDefault();
                    newFile();
                }
            }
        });

        input.addEventListener('input', function() {
            render();
            autoSave();
        });
        render();
    </script>
</body>
</html>
